name: CrashCore CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libssl-dev libpq-dev libcurl4-openssl-dev libboost-system-dev nlohmann-json3-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: ./build/crashcore_tests
